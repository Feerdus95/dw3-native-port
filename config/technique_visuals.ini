# Player-technique visual map, loaded beside the built EXE at startup.
# IDs are decimal. Each section is keyed by the technique ID used in TECHS.
# The runtime loader treats an omitted attribute as "keep this
# fighter script's original value"; an explicit "none" must be distinct.
# An empty technique section deliberately keeps all original values.
# Projectile count, placement, and fighter-specific timing are deferred.
# launch_sound_duration is an optional script-time key-off duration for cues
# that otherwise loop; when omitted, keep the fighter script's original time.
# launch_timing defaults to original (projectile, wait, sound). Explicit
# aligned moves wait first, then spawn projectile/sprite and play sound.

# Flame Ball (TECHS[0x89 - 1]): script 9, one hit.
# Launch references: Flarerizamon (fighter 0x45), original script 9 in
# data/files/0461.bin, effects archive entry 0x2B. Its script preloads and
# spawns model 331, preloads and plays sprite 1013, and plays fixed sound 38
# just before the model spawn. It also plays windup sound 51; that is outside
# the six mapped attributes and is not included as an override here.
# Impact/stage references: Flarerizamon's script plays impact sprite 4 plus
# generic sprite 2, and fixes stage 33. Flame Ball's TECHS row supplies
# impact sprite 4, hit sound 25, and stage 33. The script's sound 99 is a
# placeholder for that technique hit sound. Sprite 2 remains script-local.
[technique.0x89]
launch_timing = aligned
projectile_model = 331
launch_sprite = 1013
launch_sound = 38
impact_sprite = 4
impact_sound = 25
stage = 33

