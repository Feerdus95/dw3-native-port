; How the options' Battle sky and fog dress each fight stage (0-56). Read at
; the first battle from stages.ini by the exe.
;
; A [kind] section sets a kind's values; a [stage N] section names its kind
; and may change any value for that stage alone. A stage not listed is left
; as the original.
;
;   sky = 0/1          a gradient behind the stage instead of its flat colour
;   sky_top = r, g, b  the gradient's top (default: the stage's colour, darker)
;   fog = 0-1          how much the far side takes of the fog colour (0: none)
;   fog_start = 0-1    where it starts, part of the way to the far side
;   fog_color = r, g, b  (default: the stage's background colour)
;   horizon = units    points this far from the arena's middle are the painted
;                      horizon, kept out of the fog (0: none, all is fogged)
;
; The stages, what they look like and where they are used: the project's
; fight stage catalogue.

[sky]
sky = 1
fog = 0.6
fog_start = 0.45
horizon = 20000

[night]
sky = 1
fog = 0.8
fog_start = 0.3
horizon = 20000

[room]
sky = 0
fog = 0.5
fog_start = 0.4
fog_color = 0, 0, 0
horizon = 0

[water]
sky = 0
fog = 0.7
fog_start = 0.3
horizon = 0

